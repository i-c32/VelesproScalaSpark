# Official OpenJDK Java image. Look for the different tagged releases at
# https://hub.docker.com/_/openjdk/ . A Java image is not required
# but an image with a JVM speeds up the build a bit.
default:
  image: maven:3-openjdk-8
  cache:
    paths:
      - target/

before_script:
  # Enable the usage of sources over https
  - apt-get update -yqq
  - apt-get install apt-transport-https -yqq
  # Install SBT
  - apt-get install git -yqq

variables:
  MAVEN_CLI_OPTS: "--batch-mode"
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - build
  - test
  - deploy
  - analyze

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS compile

test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS test

deploy:
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# For SonarQube
sonarcloud-check:
  stage: analyze
  image: maven:3.9.9-jdk-17
  script: 
      # Set the sonar.java.binaries properties and don't add maven step like verify
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn org.sonarsource.scanner.maven:sonar-maven-plugin:3.7.0.1746:sonar -Dsonar.qualitygate.wait=true -Dsonar.projectKey=Noilix_HF -Dsonar.java.binaries=target/classes -Dsonar.java.source=1.8
  rules:
  - if: '$CI_COMMIT_REF_NAME == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true