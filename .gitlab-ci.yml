default:
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    paths:
      - target/

before_script:
  # Enable the usage of sources over https
  - apt-get update
  - apt-get install -yqq apt-transport-https
  # Install SBT
  - apt-get install -yqq git

variables:
  MAVEN_CLI_OPTS: "--batch-mode"
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - build
  - test
  - analyze
  - deploy

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS compile

test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS test scoverage:report
  artifacts:
    paths:
      - target/scoverage.xml
    expire_in: 1h


# For SonarQube
sonarcloud-check:
  stage: analyze
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  dependencies:
    - test
  script:
    - ls -lh target/scoverage.xml || echo "Coverage file not found!"
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Noilix_HF -Dsonar.scala.coverage.reportPaths=target/scoverage.xml
  rules:
  - if: '$CI_COMMIT_REF_NAME == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true

deploy:
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"